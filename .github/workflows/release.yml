name: Release package

# When you publish a release on GitHub (Releases -> Draft a new release),
# this builds the installation package and attaches the zip to that release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Check that the tag matches manifest.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          MANIFEST_VERSION=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          if [ "v${MANIFEST_VERSION}" != "${TAG}" ]; then
            echo "Tag ${TAG} does not match manifest version ${MANIFEST_VERSION}"
            exit 1
          fi

      - name: Build installation package
        run: bash scripts/build-release.sh

      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${TAG}" dist/*.zip --clobber
